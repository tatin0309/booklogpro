<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotech | プレミアム読書管理システム</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Bibliotech%22%2C%22short_name%22%3A%22Bibliotech%22%2C%22description%22%3A%22Premium%20Book%20Log%20System%22%2C%22start_url%22%3A%22index.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%233b67f5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.icons8.com%2Ffluency%2F512%2Fbooks.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- iOS support -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/books.png">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        premium: {
                            50: '#f5f7ff',
                            100: '#ebf0fe',
                            200: '#ced9fd',
                            300: '#b1c2fb',
                            400: '#7695f8',
                            500: '#3b67f5',
                            600: '#355df0',
                            700: '#2c4ec9',
                            800: '#233ea0',
                            900: '#1d3383',
                        },
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @layer base {
            body {
                font-family: 'Inter', 'Noto Sans JP', sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: #1e293b; /* text-slate-800 */
                transition: background-color 1000ms, color 1000ms;
                min-height: 100vh;
                font-feature-settings: "palt";
            }
        }

        /* Ambient Backgrounds */
        .ambient-dawn { background: linear-gradient(135deg, #fef2f2 0%, #e0e7ff 100%); }
        .ambient-day { background: linear-gradient(135deg, #f8fafc 0%, #dbeafe 100%); }
        .ambient-dusk { background: linear-gradient(135deg, #fff7ed 0%, #ede9fe 100%); }
        .ambient-night { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }

        .dark.ambient-night { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        .dark.ambient-dawn { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); }

        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .book-card-hover {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .book-card-hover:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 25px 50px -12px rgba(59, 103, 245, 0.25);
        }

        .phrase-card {
            background: linear-gradient(165deg, rgba(255,255,255,0.9) 0%, rgba(248,250,252,0.8) 100%);
            border-left: 4px solid #3b67f5;
        }

        .dark .phrase-card {
            background: linear-gradient(165deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.9) 100%);
        }

        .canvas-confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background-color: #cbd5e1; /* slate-300 */
            border-radius: 9999px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155; /* slate-700 */
        }

        input[type="range"] { @apply appearance-none bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full; }
        input[type="range"]::-webkit-slider-thumb { @apply appearance-none w-5 h-5 bg-premium-500 rounded-full cursor-pointer shadow-xl border-2 border-white; }

        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .progress-ring-circle {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .scanner-line {
            height: 2px;
            background: #3b67f5;
            box-shadow: 0 0 15px #3b67f5;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>

<body class="dark overflow-x-hidden ambient-night">
    <canvas id="confetti" class="canvas-confetti"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Lucide React Wrapper ---
        // Vanilla LucideのアイコンデータをReactコンポーネントに変換します
        const LucideIcons = Object.fromEntries(
            Object.entries(lucide.icons).map(([name, iconData]) => {
                return [
                    name,
                    ({ color = "currentColor", size = 24, className = "", ...props }) => {
                        return React.createElement("svg", {
                            xmlns: "http://www.w3.org/2000/svg",
                            width: size,
                            height: size,
                            viewBox: "0 0 24 24",
                            fill: "none",
                            stroke: color,
                            strokeWidth: 2,
                            strokeLinecap: "round",
                            strokeLinejoin: "round",
                            className: className,
                            ...props,
                            children: iconData.map(([tag, attrs], i) =>
                                React.createElement(tag, { ...attrs, key: i })
                            )
                        });
                    }
                ];
            })
        );

        const {
            Search, Book, BookOpen, CheckCircle, Clock, Star,
            Plus, Trash2, Moon, Sun, LayoutGrid, List, BarChart2,
            ChevronRight, ExternalLink, Filter, ArrowLeft, MoreHorizontal,
            Edit3, Bookmark, Trophy, Zap, MousePointer2, X, Sparkles, Quote, Camera
        } = LucideIcons;

        // --- Constants ---
        const STATUS_OPTIONS = [
            { id: 'all', label: 'すべて', icon: 'LayoutGrid' },
            { id: 'reading', label: '読書中', icon: 'BookOpen', color: 'text-amber-500' },
            { id: 'toread', label: '読みたい', icon: 'Clock', color: 'text-premium-500' },
            { id: 'finished', label: '読了', icon: 'CheckCircle', color: 'text-emerald-500' }
        ];

        // --- Helper Components ---
        const ProgressRing = ({ progress, size = 60, stroke = 5, color = "text-premium-500" }) => {
            const radius = (size / 2) - (stroke * 2);
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (progress / 100) * circumference;

            return (
                <div className="relative inline-flex items-center justify-center">
                    <svg width={size} height={size} className="transform -rotate-90">
                        <circle className="text-slate-200 dark:text-slate-800" strokeWidth={stroke} stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                        <circle className={`${color} transition-all duration-1000 ease-out`} strokeWidth={stroke} strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                    </svg>
                    <span className="absolute text-[10px] font-black">{Math.round(progress)}%</span>
                </div>
            );
        };

        const StatusIcon = ({ status, size = 16, className = "" }) => {
            switch (status) {
                case 'reading': return <BookOpen size={size} className={className} />;
                case 'finished': return <CheckCircle size={size} className={className} />;
                case 'toread': return <Clock size={size} className={className} />;
                default: return <Book size={size} className={className} />;
            }
        };

        const Rating = ({ value, onChange, size = 16, readonly = false }) => {
            return (
                <div className="flex gap-0.5">
                    {[1, 2, 3, 4, 5].map(star => (
                        <button key={star} type="button" onClick={() => !readonly && onChange && onChange(star)} className={`${readonly ? 'cursor-default' : 'cursor-pointer'} transition-transform active:scale-125`}>
                            <Star size={size} className={star <= value ? 'fill-amber-400 text-amber-400' : 'text-slate-300 dark:text-slate-600'} />
                        </button>
                    ))}
                </div>
            );
        };

        // --- Sub-Components (Moved outside App to prevent re-mounting focus loss) ---

        const DashboardView = ({ stats, books, onBookClick, phrases, goals }) => (
            <div className="space-y-8 animate-in fade-in duration-500">
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 grid grid-cols-2 gap-4">
                        <div className="glass shadow-sm p-6 rounded-[2rem] group">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="p-3 bg-premium-100 dark:bg-premium-900/40 rounded-2xl text-premium-600 dark:text-premium-400 group-hover:scale-110 transition-transform">
                                    <Book size={24} />
                                </div>
                                <span className="text-slate-500 dark:text-slate-400 font-bold text-sm">合計蔵書数</span>
                            </div>
                            <div className="text-4xl font-display font-black">{stats.total}<span className="text-xs font-sans font-normal ml-2 opacity-50 uppercase tracking-widest">Books</span></div>
                        </div>
                        <div className="glass shadow-sm p-6 rounded-[2rem] group">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="p-3 bg-emerald-100 dark:bg-emerald-900/40 rounded-2xl text-emerald-600 dark:text-emerald-400 group-hover:scale-110 transition-transform">
                                    <Trophy size={24} />
                                </div>
                                <span className="text-slate-500 dark:text-slate-400 font-bold text-sm">これまでに読了</span>
                            </div>
                            <div className="text-4xl font-display font-black text-emerald-500">{stats.finished}<span className="text-xs font-sans font-normal ml-2 opacity-50 uppercase tracking-widest">Completed</span></div>
                        </div>
                    </div>
                    <div className="glass shadow-xl p-6 rounded-[2rem] bg-premium-600 text-white relative overflow-hidden group">
                        <div className="relative z-10 flex flex-col h-full justify-between">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-premium-100 text-xs font-black uppercase tracking-[0.2em] mb-1">Annual Goal</p>
                                    <h4 className="text-2xl font-display font-black">読書目標 2026</h4>
                                </div>
                                <ProgressRing progress={(stats.finished / goals.annual) * 100} size={70} stroke={6} color="text-white" />
                            </div>
                            <div className="mt-4">
                                <p className="text-3xl font-display font-black">{stats.finished} / {goals.annual}</p>
                                <p className="text-premium-100/60 text-[10px] font-bold mt-1">年間目標の達成まであと {goals.annual - stats.finished} 冊</p>
                            </div>
                        </div>
                        <Sparkles className="absolute -bottom-4 -right-4 w-32 h-32 opacity-10 group-hover:rotate-12 transition-transform duration-700" />
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="space-y-6">
                        <h3 className="text-xl font-black flex items-center gap-3"><Zap className="text-amber-500" size={24} /> 現在読書中の本</h3>
                        <div className="space-y-4">
                            {books.filter(b => b.status === 'reading').length > 0 ? (
                                books.filter(b => b.status === 'reading').map(book => (
                                    <div key={book.id} onClick={() => onBookClick(book)} className="glass p-5 rounded-[2rem] flex gap-5 hover:border-premium-500 transition-all cursor-pointer group shadow-sm hover:shadow-xl">
                                        <div className="relative shrink-0 text-center">
                                            <img src={book.thumbnail} className="w-20 h-28 object-cover rounded-2xl shadow-lg group-hover:scale-105 transition-transform" alt="" />
                                            <div className="absolute -right-2 -top-2">
                                                <ProgressRing progress={book.progress} size={40} stroke={4} />
                                            </div>
                                        </div>
                                        <div className="flex-1 min-w-0 flex flex-col justify-center">
                                            <h4 className="text-lg font-black truncate leading-tight">{book.title}</h4>
                                            <p className="text-sm text-slate-500 font-medium mb-3">{book.authors.join(', ')}</p>
                                            <div className="w-full h-2 bg-slate-200/50 dark:bg-slate-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-gradient-to-r from-premium-500 to-indigo-500 rounded-full transition-all duration-1000" style={{ width: `${book.progress}%` }} />
                                            </div>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div className="glass p-12 rounded-[2.5rem] text-center border-dashed border-2 border-slate-200 dark:border-slate-800">
                                    <MousePointer2 className="mx-auto text-slate-300 mb-4 animate-bounce" size={40} />
                                    <p className="text-slate-400 font-bold">読書中の本はありません。新しい本を登録しましょう。</p>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="space-y-6">
                        <h3 className="text-xl font-black flex items-center gap-3"><Star className="text-premium-500" size={24} /> 黄金のフレーズ</h3>
                        <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                           {phrases.length > 0 ? phrases.map((p, i) => (
                               <div key={i} className="phrase-card p-6 rounded-[2rem] shadow-sm relative group overflow-hidden animate-in slide-in-from-right duration-500" style={{animationDelay: `${i*100}ms`}}>
                                   <Quote className="absolute top-4 right-4 text-premium-500/10 w-12 h-12" />
                                   <p className="text-sm font-medium italic leading-relaxed text-slate-700 dark:text-slate-200 mb-3 relative z-10">"{p.text}"</p>
                                   <div className="flex items-center gap-2">
                                       <img src={p.bookThumbnail} className="w-6 h-8 rounded shadow-sm object-cover" alt="" />
                                       <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider truncate">{p.bookTitle}</span>
                                   </div>
                               </div>
                           )) : (
                               <div className="glass p-12 rounded-[2.5rem] text-center text-slate-400 border-dashed border-2">
                                   心に響いた言葉を記録しましょう。
                               </div>
                           )}
                        </div>
                    </div>
                </div>
            </div>
        );

        const LibraryView = ({ filteredBooks, filterStatus, onFilterChange, onBookClick }) => (
            <div className="space-y-8 animate-in fade-in duration-500">
                <div className="flex flex-wrap items-center justify-between gap-6">
                    <div className="flex items-center gap-3 p-1.5 bg-slate-200/50 dark:bg-slate-800/50 backdrop-blur rounded-[1.5rem] border border-white/10">
                        {STATUS_OPTIONS.map(opt => (
                            <button key={opt.id} onClick={() => onFilterChange(opt.id)} className={`px-5 py-2 rounded-xl text-xs font-black transition-all ${filterStatus === opt.id ? 'bg-premium-600 text-white shadow-xl' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}>
                                {opt.label}
                            </button>
                        ))}
                    </div>
                    <div className="flex items-center gap-4">
                       <span className="text-xs font-black text-slate-400 uppercase tracking-widest">Total: {filteredBooks.length}</span>
                    </div>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-8">
                    {filteredBooks.map(book => (
                        <div key={book.id} onClick={() => onBookClick(book)} className="group cursor-pointer book-card-hover">
                            <div className="aspect-[2/3] relative rounded-[2rem] overflow-hidden shadow-2xl border-4 border-white dark:border-slate-800 transition-all group-hover:border-premium-500">
                                <img src={book.thumbnail} className="w-full h-full object-cover" alt="" />
                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-2 backdrop-blur-sm">
                                   <StatusIcon status={book.status} size={32} className="text-white p-2 bg-premium-600/50 rounded-full" />
                                   <span className="text-white text-[10px] font-black uppercase tracking-wider">{STATUS_OPTIONS.find(s => s.id === book.status).label}</span>
                                </div>
                                <div className="absolute bottom-0 left-0 right-0 h-2 bg-black/20">
                                    <div className="h-full bg-premium-500 shadow-[0_0_10px_#3b67f5]" style={{ width: `${book.progress}%` }} />
                                </div>
                            </div>
                            <div className="mt-4 text-center">
                                <h4 className="font-black text-sm truncate px-2 leading-tight">{book.title}</h4>
                                <p className="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-tighter">{book.authors[0]}</p>
                                <div className="flex justify-center mt-2 scale-90">
                                    <Rating value={book.rating} size={10} readonly />
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const SearchView = ({ onSearch, searchQuery, onSearchQueryChange, isSearching, searchResults, onAddBook, books }) => (
            <div className="space-y-6 animate-in fade-in duration-500">
                <form onSubmit={onSearch} className="relative group">
                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-premium-500 transition-colors" size={20} />
                    <input
                        type="text"
                        placeholder="著者名、書籍タイトル、キーワードで検索..."
                        className="w-full bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 p-4 pl-12 pr-24 rounded-3xl outline-none focus:border-premium-400 focus:ring-4 focus:ring-premium-400/10 transition-all font-medium text-slate-800 dark:text-white"
                        value={searchQuery}
                        onChange={(e) => onSearchQueryChange(e.target.value)}
                    />
                    <button
                        type="submit"
                        className="absolute right-2 top-2 bottom-2 bg-premium-600 hover:bg-premium-500 text-white px-6 rounded-2xl font-bold transition-all active:scale-95"
                    >
                        検索
                    </button>
                </form>

                {isSearching ? (
                    <div className="py-20 flex flex-col items-center gap-4 text-slate-400">
                        <div className="w-12 h-12 border-4 border-premium-500 border-t-transparent rounded-full animate-spin"></div>
                        <p className="font-medium animate-pulse">データベースを照合中...</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {searchResults.map(item => (
                            <div key={item.id} className="glass p-4 rounded-3xl flex gap-4 hover:shadow-lg transition-all group">
                                <img
                                    src={item.volumeInfo.imageLinks?.thumbnail || 'https://via.placeholder.com/150x220?text=No+Cover'}
                                    className="w-20 h-28 object-cover rounded-xl shadow-md group-hover:scale-105 transition-transform"
                                    alt=""
                                />
                                <div className="flex-1 min-w-0 flex flex-col justify-between py-1">
                                    <div>
                                        <h4 className="font-bold text-sm leading-snug line-clamp-2 dark:text-white">{item.volumeInfo.title}</h4>
                                        <p className="text-xs text-slate-500 mt-1 truncate">{item.volumeInfo.authors?.join(', ') || '著者不明'}</p>
                                    </div>
                                    <button
                                        onClick={() => onAddBook(item)}
                                        disabled={books.some(b => b.id === item.id)}
                                        className={`w-full py-1.5 rounded-xl text-xs font-bold transition-all ${books.some(b => b.id === item.id)
                                            ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                                            : 'bg-premium-100 dark:bg-premium-900/40 text-premium-600 dark:text-premium-400 hover:bg-premium-600 hover:text-white'
                                            }`}
                                    >
                                        {books.some(b => b.id === item.id) ? '追加済み' : '+ ライブラリに追加'}
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const BookDetailModal = ({ selectedBook, onClose, onUpdate, onDelete, onAddPhrase, onGetAIInsight, aiInsight }) => {
            if (!selectedBook) return null;
            const b = selectedBook;
            const [phraseText, setPhraseText] = useState('');
            const [isAISearching, setIsAISearching] = useState(false);

            const handleAnalyze = async () => {
                setIsAISearching(true);
                await onGetAIInsight(b);
                setIsAISearching(false);
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-10 animate-in fade-in duration-500">
                    <div className="absolute inset-0 bg-slate-900/40 dark:bg-black/80 backdrop-blur-md" onClick={onClose}></div>
                    <div className="glass w-full max-w-5xl max-h-full overflow-y-auto rounded-[3rem] shadow-2xl relative custom-scrollbar animate-in zoom-in-95 duration-500">
                        <div className="flex flex-col md:flex-row gap-10 p-8 md:p-12">
                            <div className="w-full md:w-80 shrink-0">
                                <div className="relative group">
                                    <img src={b.thumbnail} className="w-full aspect-[2/3] object-cover rounded-[2.5rem] shadow-2xl border-8 border-white dark:border-slate-800" alt="" />
                                    <div className="absolute inset-0 bg-gradient-to-tr from-premium-500/20 to-transparent rounded-[2.5rem]"></div>
                                </div>
                                <div className="mt-8 space-y-3">
                                    <select value={b.status} onChange={(e) => onUpdate(b.id, { status: e.target.value, finishedAt: e.target.value === 'finished' ? new Date().toISOString() : b.finishedAt, progress: e.target.value === 'finished' ? 100 : b.progress })} className="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-2xl font-black text-sm outline-none focus:ring-4 focus:ring-premium-500/20 appearance-none shadow-sm">
                                        {STATUS_OPTIONS.slice(1).map(opt => (
                                            <option key={opt.id} value={opt.id}>{opt.label}</option>
                                        ))}
                                    </select>
                                    <button onClick={() => onDelete(b.id)} className="w-full flex items-center justify-center gap-2 p-4 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-2xl transition-all text-xs font-black uppercase tracking-widest"><Trash2 size={16} /> 蔵書から削除</button>
                                </div>
                            </div>
                            <div className="flex-1 space-y-8">
                                <div className="space-y-3 relative">
                                    <button onClick={onClose} className="absolute -top-4 -right-4 p-2 bg-slate-100 dark:bg-slate-800 rounded-full hover:rotate-90 transition-transform"><X size={20} /></button>
                                    <h2 className="text-3xl md:text-5xl font-display font-black leading-tight tracking-tighter dark:text-white">{b.title}</h2>
                                    <p className="text-xl text-slate-400 font-bold">{b.authors.join(', ')}</p>
                                </div>
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="p-4 bg-slate-50 dark:bg-slate-800/40 rounded-3xl border border-white/40 dark:border-white/5 text-center">
                                        <p className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">Total Pages</p>
                                        <p className="font-display font-black text-2xl">{b.pages}<span className="text-xs ml-1 opacity-50 font-sans">P</span></p>
                                    </div>
                                    <div className="p-4 bg-slate-50 dark:bg-slate-800/40 rounded-3xl border border-white/40 dark:border-white/5 text-center">
                                        <p className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">My Rating</p>
                                        <div className="flex justify-center pt-1"><Rating value={b.rating} size={14} readonly /></div>
                                    </div>
                                    <div className="lg:col-span-2 p-4 bg-premium-600 text-white rounded-3xl shadow-lg relative overflow-hidden group">
                                        <Zap className="absolute right-[-10px] bottom-[-10px] w-16 h-16 opacity-10 group-hover:scale-125 transition-transform" />
                                        <p className="text-premium-100 text-[10px] font-black uppercase tracking-widest mb-1 relative z-10">Current Progress</p>
                                        <div className="flex items-end gap-2 relative z-10">
                                            <span className="font-display font-black text-3xl leading-none">{b.progress}</span><span className="text-sm font-bold opacity-60 pb-1">%</span>
                                            <input type="range" className="flex-1 h-3 mb-1 accent-white" min="0" max="100" value={b.progress} onChange={(e) => onUpdate(b.id, { progress: parseInt(e.target.value), status: parseInt(e.target.value) === 100 ? 'finished' : (parseInt(e.target.value) > 0 ? 'reading' : b.status) })} />
                                        </div>
                                    </div>
                                </div>
                                <div className="glass p-6 rounded-[2.5rem] bg-indigo-500/5 dark:bg-premium-900/10 border-indigo-500/10 border-2">
                                    <div className="flex items-center justify-between mb-4">
                                        <h4 className="text-sm font-black flex items-center gap-3 text-indigo-600 dark:text-premium-400 uppercase tracking-widest"><Sparkles size={18} /> AI Insight & Strategy</h4>
                                        <button onClick={handleAnalyze} disabled={isAISearching} className="text-[10px] font-black bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-500 transition-all disabled:opacity-50">{isAISearching ? '分析中...' : '要約 & 次の推薦'}</button>
                                    </div>
                                    {aiInsight ? (
                                        <div className="animate-in fade-in slide-in-from-top-2 duration-500 space-y-4">
                                            <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed font-bold italic">"{aiInsight.summary}"</p>
                                            <div className="pt-3 border-t border-indigo-500/10">
                                                <p className="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2">Next Book Suggestion</p>
                                                <div className="flex items-start gap-4 p-3 bg-white/50 dark:bg-slate-900/50 rounded-2xl">
                                                   <Book size={20} className="text-premium-500 shrink-0 mt-1" />
                                                   <div>
                                                       <p className="text-xs font-black leading-tight">{aiInsight.nextBook}</p>
                                                       <p className="text-[10px] text-slate-500 font-medium mt-1">{aiInsight.why}</p>
                                                   </div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-[10px] font-bold text-slate-400 text-center py-4">AIが本の要約と次に読むべき一冊を導き出します。</p>
                                    )}
                                </div>
                                <div className="space-y-6">
                                    <div className="space-y-4">
                                        <h4 className="text-sm font-black flex items-center gap-3 text-slate-400 uppercase tracking-widest"><Star size={18} className="text-amber-500" /> 黄金のフレーズを刻む</h4>
                                        <div className="flex gap-3">
                                            <input type="text" placeholder="心に残った一文を入力..." className="flex-1 bg-slate-100 dark:bg-slate-800/60 p-4 rounded-2xl text-sm font-bold outline-none placeholder:text-slate-400" value={phraseText} onChange={(e) => setPhraseText(e.target.value)} />
                                            <button onClick={() => { if(phraseText.trim()) { onAddPhrase(b.id, phraseText); setPhraseText(''); } }} className="p-4 bg-premium-600 text-white rounded-2xl hover:scale-105 transition-all shadow-lg active:scale-95"><Plus size={20} /></button>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <h4 className="text-sm font-black flex items-center gap-3 text-slate-400 uppercase tracking-widest"><Edit3 size={18} /> 深い考察と読書メモ</h4>
                                        <textarea className="w-full bg-slate-100 dark:bg-slate-800/40 p-6 rounded-[2rem] outline-none min-h-[160px] text-sm font-bold leading-relaxed resize-none custom-scrollbar" placeholder="感銘を受けたポイント、将来の自分へのメッセージ..." value={b.memo} onChange={(e) => onUpdate(b.id, { memo: e.target.value })} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ScannerSimulator = ({ onComplete, onClose }) => {
            useEffect(() => { const timer = setTimeout(() => { onComplete(); }, 2500); return () => clearTimeout(timer); }, []);
            return (
                <div className="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center p-8">
                    <div className="w-full max-w-sm aspect-square border-4 border-premium-500 rounded-3xl relative overflow-hidden bg-slate-900 group">
                        <div className="absolute inset-0 flex items-center justify-center"><Camera className="w-32 h-32 text-slate-800" /></div>
                        <div className="absolute top-0 left-0 w-full h-1 scanner-line"></div>
                        <div className="absolute inset-0 bg-premium-500/10 animate-pulse"></div>
                    </div>
                    <div className="mt-12 text-center text-white space-y-4">
                        <p className="text-xl font-black uppercase tracking-[0.3em] animate-pulse">Scanning ISBN...</p>
                        <button onClick={onClose} className="mt-8 px-10 py-3 bg-white/10 hover:bg-white/20 rounded-full text-xs font-black transition-all">Cancel</button>
                    </div>
                </div>
            );
        };

        // --- App Component ---
        const App = () => {
            const [books, setBooks] = useState(() => {
                const saved = localStorage.getItem('bibliotech_books');
                return saved ? JSON.parse(saved) : [];
            });
            const [activeTab, setActiveTab] = useState('library');
            const [filterStatus, setFilterStatus] = useState('all');
            const [isDark, setIsDark] = useState(true);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isSearching, setIsSearching] = useState(false);
            const [selectedBook, setSelectedBook] = useState(null);
            const [showDetail, setShowDetail] = useState(false);
            const [phrases, setPhrases] = useState(() => {
                const saved = localStorage.getItem('bibliotech_phrases');
                return saved ? JSON.parse(saved) : [];
            });
            const [goals, setGoals] = useState({ annual: 50 });
            const [aiInsights, setAIInsights] = useState({});
            const [isScanning, setIsScanning] = useState(false);

            // Ambient background controller
            useEffect(() => {
                const updateBackground = () => {
                    const hour = new Date().getHours();
                    let cls = 'ambient-day';
                    if (hour >= 5 && hour < 8) cls = 'ambient-dawn';
                    else if (hour >= 8 && hour < 17) cls = 'ambient-day';
                    else if (hour >= 17 && hour < 20) cls = 'ambient-dusk';
                    else cls = 'ambient-night';
                    document.body.className = `antialiased text-slate-800 transition-colors duration-1000 min-h-screen overflow-x-hidden ${isDark ? 'dark ' : ''}${cls}`;
                };
                updateBackground();
                const interval = setInterval(updateBackground, 1000 * 60);
                return () => clearInterval(interval);
            }, [isDark]);

            const triggerConfetti = useCallback(() => {
                const canvas = document.getElementById('confetti');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const pieces = [];
                const colors = ['#3b67f5', '#7c3aed', '#10b981', '#f59e0b', '#dc2626'];
                for (let i = 0; i < 150; i++) {
                    pieces.push({ x: Math.random() * canvas.width, y: -20, size: Math.random() * 8 + 5, color: colors[Math.floor(Math.random() * colors.length)], speed: Math.random() * 5 + 3, rotation: Math.random() * 360, rotateSpeed: Math.random() * 2 - 1 });
                }
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    let active = false;
                    pieces.forEach(p => {
                        p.y += p.speed; p.rotation += p.rotateSpeed;
                        if (p.y < canvas.height) active = true;
                        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180); ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); ctx.restore();
                    });
                    if (active) requestAnimationFrame(animate);
                };
                animate();
            }, []);

            useEffect(() => {
                localStorage.setItem('bibliotech_books', JSON.stringify(books));
                localStorage.setItem('bibliotech_phrases', JSON.stringify(phrases));
            }, [books, phrases]);

            const addBook = (googleBook) => {
                const info = googleBook.volumeInfo;
                if (books.some(b => b.id === googleBook.id)) { alert('既にライブラリに追加されています'); return; }
                const newBook = { id: googleBook.id, title: info.title, authors: info.authors || ['不明'], thumbnail: info.imageLinks?.thumbnail || 'https://via.placeholder.com/150x220?text=No+Cover', pages: info.pageCount || 100, status: 'toread', rating: 0, memo: '', progress: 0, addedAt: new Date().toISOString(), finishedAt: null, description: info.description || '' };
                setBooks([newBook, ...books]);
                setActiveTab('library'); setSearchQuery(''); setSearchResults([]);
            };

            const updateBook = (id, updates) => {
                const current = books.find(b => b.id === id);
                if (updates.progress === 100 && current.progress < 100) triggerConfetti();
                setBooks(books.map(b => b.id === id ? { ...b, ...updates } : b));
                if (selectedBook?.id === id) setSelectedBook({ ...selectedBook, ...updates });
            };

            const deleteBook = (id) => {
                if (!confirm('ライブラリから削除しますか？')) return;
                setBooks(books.filter(b => b.id !== id));
                if (selectedBook?.id === id) setShowDetail(false);
            };

            const addPhrase = (bookId, text) => {
                const book = books.find(b => b.id === bookId);
                const newPhrase = { bookId, bookTitle: book.title, bookThumbnail: book.thumbnail, text, addedAt: new Date().toISOString() };
                setPhrases([newPhrase, ...phrases]);
            };

            const getAIInsight = async (book) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        const insight = { summary: `${book.title}は深い洞察に満ちた作品です。`, nextBook: "Atomic Habits", why: "習慣化のヒントが得られます。" };
                        setAIInsights(prev => ({ ...prev, [book.id]: insight }));
                        resolve(insight);
                    }, 1500);
                });
            };

            const filteredBooks = useMemo(() => {
                if (filterStatus === 'all') return books;
                return books.filter(b => b.status === filterStatus);
            }, [books, filterStatus]);

            const stats = useMemo(() => {
                return { total: books.length, reading: books.filter(b => b.status === 'reading').length, finished: books.filter(b => b.status === 'finished').length, toRead: books.filter(b => b.status === 'toread').length, totalPages: books.reduce((sum, b) => sum + (b.status === 'finished' ? b.pages : 0), 0) };
            }, [books]);

            const handleSearch = async (e) => {
                e?.preventDefault();
                if (!searchQuery.trim()) return;
                setIsSearching(true); setActiveTab('search');
                try {
                    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(searchQuery)}&maxResults=20`);
                    const data = await res.json();
                    setSearchResults(data.items || []);
                } catch (err) {
                    console.error("Search error:", err);
                } finally {
                    setIsSearching(false);
                }
            };

            return (
                <div className="pb-24 lg:pb-0 lg:pl-64 min-h-screen">
                    {/* Sidebar Nav */}
                    <nav className="fixed bottom-0 left-0 right-0 z-50 lg:top-0 lg:w-64 lg:h-screen glass border-t lg:border-t-0 lg:border-r border-slate-200 dark:border-slate-800 p-2 lg:p-6 flex lg:flex-col justify-between items-center lg:items-stretch">
                        <div className="hidden lg:flex items-center gap-3 mb-10 px-2 group cursor-default">
                            <div className="p-2 bg-premium-600 rounded-2xl text-white shadow-lg group-hover:rotate-12 transition-transform duration-500">
                                <BookOpen size={24} />
                            </div>
                            <span className="font-display font-black text-xl tracking-tight dark:text-white">Bibliotech</span>
                        </div>

                        <div className="flex lg:flex-col gap-2 flex-1 justify-center lg:justify-start w-full px-2 lg:px-0">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`flex items-center justify-center lg:justify-start gap-4 px-4 py-3 rounded-2xl transition-all duration-300 ${activeTab === 'dashboard'
                                    ? 'bg-premium-600 text-white shadow-lg shadow-premium-600/20'
                                    : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100'}`}
                            >
                                <BarChart2 size={24} /> <span className="hidden lg:inline font-bold">ダッシュボード</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('library')}
                                className={`flex items-center justify-center lg:justify-start gap-4 px-4 py-3 rounded-2xl transition-all duration-300 ${activeTab === 'library'
                                    ? 'bg-premium-600 text-white shadow-lg shadow-premium-600/20'
                                    : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100'}`}
                            >
                                <LayoutGrid size={24} /> <span className="hidden lg:inline font-bold">マイライブラリ</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('search')}
                                className={`flex items-center justify-center lg:justify-start gap-4 px-4 py-3 rounded-2xl transition-all duration-300 ${activeTab === 'search'
                                    ? 'bg-premium-600 text-white shadow-lg shadow-premium-600/20'
                                    : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100'}`}
                            >
                                <Search size={24} /> <span className="hidden lg:inline font-bold">書籍を探す</span>
                            </button>
                        </div>

                        <div className="flex lg:flex-col gap-4 items-center">
                            <button
                                onClick={() => setIsDark(!isDark)}
                                className="p-3 text-slate-500 hover:bg-slate-200/50 dark:hover:bg-slate-800 rounded-2xl transition-all"
                            >
                                {isDark ? <Sun size={24} /> : <Moon size={24} />}
                            </button>
                            <div className="hidden lg:flex items-center gap-3 p-3 bg-slate-100 dark:bg-slate-800/60 rounded-3xl w-full border border-slate-200/50 dark:border-slate-700/50">
                                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-premium-400 to-emerald-400 border-2 border-white shadow-sm" />
                                <div className="flex-1 min-w-0">
                                    <p className="text-xs font-bold truncate">Premium User</p>
                                    <p className="text-[10px] text-slate-400">Basic Plan</p>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-10">
                        <header className="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-2xl sm:text-3xl font-display font-black tracking-tight dark:text-white">
                                    {activeTab === 'dashboard' && 'おかえりなさい'}
                                    {activeTab === 'library' && 'あなたの蔵書'}
                                    {activeTab === 'search' && '新たな発見'}
                                </h1>
                                <p className="text-slate-500 font-medium text-sm mt-1">
                                    {activeTab === 'dashboard' && '読書データと現在の進捗状況です'}
                                    {activeTab === 'library' && 'ライブラリ内のすべての本を管理します'}
                                    {activeTab === 'search' && 'Google Booksの膨大なデータベースから探します'}
                                </p>
                            </div>
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setIsScanning(true)}
                                    className="p-3 bg-white/50 dark:bg-slate-800/50 rounded-2xl hover:bg-premium-600 hover:text-white transition-all shadow-sm group"
                                    title="バーコードスキャン"
                                >
                                    <Camera size={20} className="group-hover:scale-110 transition-transform" />
                                </button>
                                {activeTab !== 'search' && (
                                    <button
                                        onClick={() => setActiveTab('search')}
                                        className="bg-premium-600 hover:bg-premium-500 text-white px-5 py-2.5 rounded-2xl font-bold flex items-center gap-2 shadow-lg shadow-premium-600/30 transition-all active:scale-95 text-sm"
                                    >
                                        <Plus size={18} /> 新規登録
                                    </button>
                                )}
                            </div>
                        </header>

                        <div className="relative">
                            {activeTab === 'dashboard' && (
                                <DashboardView
                                    stats={stats}
                                    books={books}
                                    onBookClick={(book) => { setSelectedBook(book); setShowDetail(true); }}
                                    phrases={phrases}
                                    goals={goals}
                                />
                            )}
                            {activeTab === 'library' && (
                                <LibraryView
                                    filteredBooks={filteredBooks}
                                    filterStatus={filterStatus}
                                    onFilterChange={setFilterStatus}
                                    onBookClick={(book) => { setSelectedBook(book); setShowDetail(true); }}
                                />
                            )}
                            {activeTab === 'search' && (
                                <SearchView
                                    onSearch={handleSearch}
                                    searchQuery={searchQuery}
                                    onSearchQueryChange={setSearchQuery}
                                    isSearching={isSearching}
                                    searchResults={searchResults}
                                    onAddBook={addBook}
                                    books={books}
                                />
                            )}
                        </div>
                    </main>

                    <BookDetailModal
                        selectedBook={showDetail ? selectedBook : null}
                        onClose={() => setShowDetail(false)}
                        onUpdate={updateBook}
                        onDelete={deleteBook}
                        onAddPhrase={addPhrase}
                        onGetAIInsight={getAIInsight}
                        aiInsight={selectedBook ? aiInsights[selectedBook.id] : null}
                    />

                    {isScanning && (
                        <ScannerSimulator
                            onComplete={() => {
                                setIsScanning(false);
                                setSearchQuery('9784150117054'); // ハヤカワ文庫などのダミーISBN
                                handleSearch();
                            }}
                            onClose={() => setIsScanning(false)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
